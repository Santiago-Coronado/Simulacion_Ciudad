<!DOCTYPE html>
<html>
    <head>
        <title>TRON: Simulation</title>
        <link rel="stylesheet" href="/css/styles.css">
        <script defer type="module" src="traffic_Agents.js"></script>
        <style>
            body {
                background-color: #1A1A33;
            }

            #headerContainer {
                background-color: #A2D3D9;
            }

            #musicPlayer {
                position: fixed;
                bottom: 20px;
                right: 20px;
                padding: 10px;
                border-radius: 8px;
                z-index: 1000;
            }
            #musicPlayer audio {
                width: 125px;
            }
        </style>
    </head>

    <body>
        <div id='headerContainer'>
            <h1>TRON: Simulation</h1>
        </div>
        <canvas id="canvas"></canvas>

        <div id="musicPlayer">
            <audio controls>
                <source src="/assets/music/TRON.mp3" type="audio/mpeg">
            </audio>
        </div>
    </body>
</html>
